[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "icfr-forensics"
version = "1.0.0"
description = "PCAP reconstruction and real-time network forensics dashboard prototype"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
icfr = ["web/*"]
